name: Build and Push to Harbor

on:
  push:
    branches: [ main ]
    tags: [ '*.*.*' ]

# Least privilege for the workflow token
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Normalize HARBOR_URL: drop https://, trailing slashes, whitespace; lowercase.
      - name: Prepare registry name
        id: reg
        env:
          RAW: ${{ secrets.HARBOR_URL }}
        run: |
          REG=$(printf '%s' "$RAW" | tr -d '[:space:]' | sed -E 's#^https?://##; s#/+$##' | tr '[:upper:]' '[:lower:]')
          if [ -z "$REG" ]; then echo "::error::HARBOR_URL secret is empty"; exit 1; fi
          echo "registry=$REG" >> "$GITHUB_OUTPUT"
          echo "image=$REG/private/mrff-calculator" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # No legal-docs step: Impressum / Privacy Policy / Disclaimer are linked
      # from the main WordPress site (mrfinancialfreedom.com) in the page footer.

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.reg.outputs.image }}:dev
            ${{ steps.reg.outputs.image }}:${{ github.sha }}
