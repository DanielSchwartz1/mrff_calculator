# ---------- http-level settings (this file is included inside nginx's http {} block) ----------

# Only /embed.html may be framed by other websites (the embed widget).
# An empty value means nginx does not send the header at all.
map $uri $frame_ancestors {
    /embed.html  "*";
    default      "'none'";
}
map $uri $x_frame_options {
    /embed.html  "";
    default      "DENY";
}

# Rate limiting per client IP: 10 requests/s on average, bursts up to 50.
# A normal visit needs 1-3 requests to this server, so real users never hit it.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_status 429;

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens off;

    # Take the real client IP from Traefik's X-Forwarded-For header, so the rate limit
    # applies per visitor and not to the ingress pod. 10.42/10.43 = k3s default pod/service CIDRs.
    set_real_ip_from 10.42.0.0/16;
    set_real_ip_from 10.43.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Health endpoint for Kubernetes probes (not rate limited)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Static files: robots.txt, ads.txt, sitemap.xml, og-image.png, favicon
    location ~* \.(txt|xml|png|ico|svg)$ {
        limit_req zone=perip burst=50 nodelay;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        limit_req zone=perip burst=50 nodelay;

        # "/" -> index.html (index directive); unknown paths -> real 404
        # instead of a soft 404 (better for Google indexing).
        try_files $uri $uri/ =404;

        # Per-request CSP nonce: $request_id is 32 random hex chars, injected into
        # every <script nonce="__CSP_NONCE__"> and into the CSP header below.
        sub_filter       '__CSP_NONCE__' $request_id;
        sub_filter_once  off;
        sub_filter_types text/html;

        # Strict CSP (Google's recommended form, compatible with AdSense):
        # only scripts carrying the nonce, plus scripts they load, may run.
        # 'unsafe-inline' and https: are fallbacks for very old browsers only;
        # modern browsers ignore them when a nonce + 'strict-dynamic' is present.
        add_header Content-Security-Policy "script-src 'nonce-$request_id' 'strict-dynamic' https: 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors $frame_ancestors; upgrade-insecure-requests" always;
        add_header X-Frame-Options $x_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        # The nonce changes per request, so the HTML must not be cached.
        add_header Cache-Control "no-store" always;
    }
}
