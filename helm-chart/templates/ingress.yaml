apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-calculator-mrfinancialfreedom-com
  namespace: portfolio-prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Traefik: <namespace>-<middleware name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-prod-mrff-calculator-redirect-https@kubernetescrd
spec:
  tls:
  - hosts:
    - calculator.mrfinancialfreedom.com
    secretName: calculator-mrfinancialfreedom-com-tls
  rules:
  - host: calculator.mrfinancialfreedom.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mrff-calculator
            port:
              number: 80
